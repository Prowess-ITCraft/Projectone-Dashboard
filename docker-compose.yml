name: projectone

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    ports:
      - '9555:9555'
    environment:
      # bind mounts from Windows and macOS hosts do not deliver file events, so the watcher polls
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_URL: http://localhost:9666
    volumes:
      - ./frontend:/app
      # container keeps its own Linux node_modules instead of the host's
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
