name: projectone

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    ports:
      - '9555:9555'
    environment:
      # bind mounts from Windows and macOS hosts do not deliver file events, so the watcher polls
      CHOKIDAR_USEPOLLING: 'true'
      # the dev server forwards /api to the api service, so the session cookie stays on the app's own address
      API_PROXY_TARGET: http://api:9666
    volumes:
      - ./frontend:/app
      # container keeps its own Linux node_modules instead of the host's
      - frontend_node_modules:/app/node_modules

  api:
    build: ./backend
    ports:
      - '9666:9666'
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://projectone:projectone@postgres:5432/projectone
      CORS_ORIGINS: http://localhost:9555
      # the engineers' starting password; set it in your shell or an untracked .env next to this file, never in git
      DEFAULT_ENGINEER_PASSWORD: ${DEFAULT_ENGINEER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectone
      POSTGRES_PASSWORD: projectone
      POSTGRES_DB: projectone
    ports:
      # published for local tools only; the api reaches it inside the compose network
      - '9667:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectone -d projectone']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  frontend_node_modules:
  postgres_data:
